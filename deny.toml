# cargo-deny configuration. Do not loosen without explicit approval (rule 01 / rule 08).
[graph]
all-features = true

[advisories]
# every ignore needs a comment with reason and an expiry date
ignore = [
  # Transitive dependency of smithay 0.7.0 (cgmath 0.18.0). Unmaintained notice only, no vulnerability.
  # Review when upgrading to Smithay 0.8.0 or by 2026-12-31.
  "RUSTSEC-2026-0196",
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93
# MPL-2.0 and LGPL-* require explicit human approval: add a documented per-crate exception here, never a global allow.
exceptions = [
  # Approved for Phase 2 DRM/udev device discovery (dynamic linking)
  { name = "udev", allow = ["LGPL-2.1", "LGPL-2.1-only", "LGPL-2.1-or-later"] },
]

[licenses.private]
# Ignore unpublished workspace crates with proprietary license (publish = false)
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
