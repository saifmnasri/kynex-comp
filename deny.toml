# cargo-deny configuration. Do not loosen without explicit approval (rule 01 / rule 08).
[graph]
all-features = true

[advisories]
ignore = []   # every ignore needs a comment with reason and an expiry date

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "BSL-1.0",
]
confidence-threshold = 0.93
# MPL-2.0 and LGPL-* require explicit human approval: add a documented per-crate exception here, never a global allow.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # workspace path dependencies
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
